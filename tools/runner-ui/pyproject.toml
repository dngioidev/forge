[project]
name = "forge-cockpit"
version = "0.1.0"
description = "Forge Claude Code cockpit — framework-agnostic Python cores for the local self-hosted runner fleet (ADR-0006/0008). The PySide6 desktop UI and PyInstaller packaging were retired in #355 (dropping the LGPL dep); the FastAPI web app (#351) rebuilds the UI on these cores."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "psutil>=5.9",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # PTY-over-websocket terminal bridge (#353, ADR-0008). `websockets` gives
    # uvicorn a native ws implementation (BSD-3-Clause); `pywinpty` is the Windows
    # ConPTY backend (MIT, Windows-only marker) — POSIX uses the stdlib `pty`.
    "websockets>=12",
    "pywinpty>=2.0; sys_platform == 'win32'",
]

[project.scripts]
# Restores the `forge-cockpit` launch command #355 retired with the desktop UI —
# now serves the FastAPI backend on 127.0.0.1 (ADR-0008 / #351) instead of a Qt window.
forge-cockpit = "forge_cockpit.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forge_cockpit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
