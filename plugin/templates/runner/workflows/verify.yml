# forge local self-hosted-runner CI (ADR-0005 decisions 3 + 4).
#
# PRIVATE REPOS ONLY. A self-hosted runner must never process fork PRs — forge:init
# --runner refuses on a public repo, and this workflow keeps the local `{{LABEL}}`
# runner off any untrusted code path (see docs/security & GitHub's self-hosted-runner
# security guidance).
#
# Cost model: Linux legs run for $0 on the local ephemeral container runner
# (`{{LABEL}}` label). The Windows leg runs as a normal per-PR check on hosted
# `windows-latest` (billed per PR). When a native Windows host runner is present
# (the ADR-0005 default), switch the `test-windows` job's `runs-on` to
# `[self-hosted, windows, {{LABEL}}]` to make it free too — see runner/README.md.
name: verify

on:
  push:
    branches: [main]
  pull_request:

# Distinct concurrency group so this runner variant can never collide with an
# incumbent `name: verify` workflow. Both would otherwise resolve to the same
# `${{ github.workflow }}-${{ github.ref }}` group (both are `name: verify`) and,
# with cancel-in-progress, silently cancel each other during the review window
# where verify.yml and verify.runner.yml coexist before the swap (see #236). A
# fixed prefix keeps the group unique yet still self-cancels stale runs per ref.
concurrency:
  group: verify-runner-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Linux legs — every PR + push, on the free local ephemeral runner.
  test-linux:
    permissions:
      contents: read
    runs-on: [self-hosted, linux, {{LABEL}}]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: {{VERIFY}}

  # Windows leg — a normal per-PR check on hosted windows-latest (every push +
  # PR, same as Linux). Flip runs-on to the native self-hosted Windows runner
  # when a box is present to make it free too.
  test-windows:
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: {{VERIFY}}

  # actionlint runs as a pinned, checksum-verified BINARY — not a docker://
  # container action. On the containerized {{LABEL}} runner a container action
  # is bind-mounted `-v .../_work/<repo>:/github/workspace`, but that host path
  # only exists inside the runner container, not on the host docker daemon the
  # sibling container talks to → /github/workspace is empty and actionlint aborts
  # with "no project was found in any parent directories" (see #238). Installing
  # the binary and running it in the job's own workspace avoids the nested
  # bind-mount entirely while keeping supply-chain integrity via SHA-256.
  actionlint:
    permissions:
      contents: read
    runs-on: [self-hosted, linux, {{LABEL}}]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install actionlint (pinned v1.7.7, SHA-256 verified)
        run: |
          version=1.7.7
          sha256=023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
          tarball="actionlint_${version}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${tarball}"
          echo "${sha256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          chmod +x actionlint
      - run: ./actionlint -color

  plugin-validate:
    permissions:
      contents: read
    runs-on: [self-hosted, linux, {{LABEL}}]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate ./plugin --strict
