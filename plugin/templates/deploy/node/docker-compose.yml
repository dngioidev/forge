# Local run — environment zero (spec §10). `docker compose up` and you have
# the app exactly as production runs it, minus cloud wiring.
services:
  {{APP}}:
    build: .
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080{{HEALTHCHECK}}"]
      interval: 30s
      timeout: 3s
      retries: 3
