name: verify

# Fork-PR safety (see docs/security/oss-ci-hardening.md):
#   - Trigger is `pull_request`, NOT `pull_request_target` — untrusted fork code
#     runs with a read-only GITHUB_TOKEN and no access to repo/org secrets.
#   - No `secrets.*` are referenced by any job, so nothing is exposed to forks.
#   - Least-privilege permissions are set at the top level AND per job (below),
#     so a future top-level widening cannot silently grant a job write access.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default token scope for the whole workflow: read-only checkout, nothing else.
permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  actionlint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: docker://rhysd/actionlint@sha256:1d74bfc9fd1963af8f89a7c22afaaafd42f49aad711a09951d02cb996398f61d # 1.7.7
        with:
          args: -color

  plugin-validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # #149: guard the plugin manifest + component frontmatter. Catches the
      # unquoted-description YAML break that silently drops agent model/tool pins.
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate ./plugin --strict
